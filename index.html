<!doctype html>
<html lang="en" class="dark scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('chem_theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Chemistry Made Easy | Organic Chemistry Naming Coach</title>

  <!-- Meta Tags & SEO -->
  <meta name="description"
    content="Chemistry Made Easy: Learn to build IUPAC organic chemistry names step-by-step with interactive nomenclature lessons, isomer visualization, and WAEC, JAMB, NECO & IJMB practice questions." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="apple-mobile-web-app-title" content="Chemistry Made Easy" />

  <!-- OpenGraph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Chemistry Made Easy — Organic Chemistry Naming Coach" />
  <meta property="og:description"
    content="Chemistry Made Easy: Learn to name organic compounds step-by-step using interactive visual IUPAC rules, isomer comparisons, and exam question banks." />

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-white dark:bg-black text-slate-900 dark:text-white font-sans antialiased selection:bg-brand-500 selection:text-white min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(
          (registration) => {
            console.log('Mosunmola Coop ServiceWorker registered:', registration.scope);
          },
          (err) => {
            console.log('Mosunmola Coop ServiceWorker registration failed:', err);
          }
        );
      });
    }
  </script>
</body>

</html>
